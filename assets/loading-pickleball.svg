<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" role="img" aria-labelledby="title description">
  <title id="title">PiQueueBall paddle and pickleball</title>
  <desc id="description">A bright pickleball travels past a paddle, leaving a white trail.</desc>
  <defs>
    <linearGradient id="trail" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".95"/>
    </linearGradient>
  </defs>
  <style>
    .flight{
      transform-box:view-box;
      transform-origin:0 0;
      animation:splash-ball-flight 2.4s cubic-bezier(.42,0,.58,1) both;
    }
    @keyframes splash-ball-flight{
      0%{transform:translate(0,0)}
      30%{transform:translate(65px,-14px)}
      60%{transform:translate(145px,14px)}
      100%{transform:translate(230px,-6px)}
    }
    @media(prefers-reduced-motion:reduce){
      .flight{animation:none;transform:translate(0,0)}
    }
  </style>
  <g>
    <path d="M89 143h26v56a10 10 0 0 1-10 10H99a10 10 0 0 1-10-10z"
      fill="#197b70" stroke="#fff" stroke-width="4"/>
    <path d="M77 18h42c19 0 33 14 33 33v48c0 20-8 35-24 47l-19 14c-4 3-7 8-7 13v26c0 6-4 10-10 10h-2c-6 0-10-4-10-10v-26c0-5-3-10-7-13l-19-14c-16-12-24-27-24-47V51c0-19 14-33 33-33z"
      fill="#174b32" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M93 177h14m-14 8h14m-14 8h14"
      fill="none" stroke="#bde65d" stroke-width="3" stroke-linecap="round"/>
    <path d="M77 25h42c15 0 26 11 26 26v48c0 17-7 29-20 39l-18 14H89l-18-14c-13-10-20-22-20-39V51c0-15 11-26 26-26z"
      fill="#202c2b" stroke="#45cbbb" stroke-width="4" stroke-linejoin="round"/>
    <path d="M68 50v47c0 14 5 24 17 33m43-80v47c0 14-5 24-17 33"
      fill="none" stroke="#bde65d" stroke-width="3" stroke-linecap="round" opacity=".9"/>
    <path d="M83 62h30m-27 9h23"
      fill="none" stroke="#45cbbb" stroke-width="3" stroke-linecap="round" opacity=".75"/>
  </g>
  <g class="flight" transform="translate(145 103)">
    <path d="M-110 0c31-13 67-13 99 0" fill="none" stroke="url(#trail)" stroke-linecap="round" stroke-width="9"/>
    <circle r="25" fill="#bde65d" stroke="#fff" stroke-width="3"/>
    <g fill="#fff">
      <circle cx="-10" cy="-10" r="3.6"/><circle cx="9" cy="-12" r="3.6"/>
      <circle cx="-16" cy="4" r="3.6"/><circle cx="0" cy="1" r="3.6"/>
      <circle cx="15" cy="5" r="3.6"/><circle cx="-7" cy="16" r="3.6"/>
      <circle cx="10" cy="17" r="3.6"/>
    </g>
  </g>
</svg>
