<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174b32">
  <title>PiQueueBall</title>
  <link rel="icon" href="assets/logo.svg">
  <link rel="preload" href="assets/loading-pickleball.svg" as="image" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="offline.js" defer></script>
</head>
<body class="loading-page">
  <main class="splash-screen" aria-label="Loading PiQueueBall">
    <div class="splash-content">
      <img class="splash-logo" src="assets/logo.svg" alt="PiQueueBall">
      <p class="splash-kicker">YOUR COURT IS CALLING</p>
      <h1>Let's get on court.</h1>
      <img class="splash-play-icon" src="assets/loading-pickleball.svg"
        alt="A pickleball flying past a paddle with a white trail">
      <p class="splash-status" role="status" aria-live="polite">Getting your court ready...</p>
      <span class="splash-progress" aria-hidden="true"><span></span></span>
      <noscript><a class="splash-fallback" href="login.html">Continue to log in</a></noscript>
    </div>
  </main>
  <script>
    window.setTimeout(function () {
      document.body.classList.add("splash-leaving");
    }, 2250);
    window.setTimeout(function () {
      window.location.replace("login.html");
    }, 2500);
  </script>
</body>
</html>
